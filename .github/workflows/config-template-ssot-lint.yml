name: Config Template SSOT Lint

# Received from neomjs/neo with the subject it polices. The whole scan set is Agent OS config,
# templates, bases and sources plus the ADR-0019 catalog, and every one of those left the Engine.
#
# The watched set below is the lint's own `SCAN_SURFACE` export, verbatim. That export exists so the
# invariant is mechanical rather than YAML prose: what the lint SCANS must be a subset of what the
# workflow WATCHES, or a PR can introduce a violation that only turns the NEXT unrelated run red —
# late, misattributed enforcement. Adding a scan root without widening this list is the defect the
# export was created to make impossible, so keep them in lockstep by copying, never by editing one.
#
# Path shapes changed in the move. The Agent OS was one directory (`ai/`) in the source repository;
# here it IS the repository, split across plane roots, and the Tier-1 config authority is split per
# plane — a Host-Edge copy at the root and a Cloud copy under cloud/. `ai/deploy/**` became
# `cloud/deploy/**`, and both AiConfig guards travelled with their subject: their scan filter was
# `f.startsWith('ai/')`, so left in the Engine they would have found nothing, printed "0 files in
# scope", and exited 0 forever.

on:
  pull_request:
    branches: [dev]
    paths:
      # --- SCAN_SURFACE, verbatim ---
      - 'cloud/**/*.mjs'
      - 'daemons/**/*.mjs'
      - 'mcp/**/*.mjs'
      - 'scripts/**/*.mjs'
      - 'services/**/*.mjs'
      - 'shared/**/*.mjs'
      - 'config.template.mjs'
      - 'configBase.mjs'
      - 'ConfigProvider.mjs'
      - 'config.mjs'
      - 'test/**/*.mjs'
      - 'cloud/deploy/**'
      - 'learn/agentos/decisions/0019-aiconfig-reactive-provider-ssot.md'
      - 'scripts/lint/check-aiconfig-antipatterns.mjs'
      - 'scripts/lint/check-aiconfig-test-mutation.mjs'
      # --- inputs to the verdict that are not scanned sources ---
      # The parity snapshot is an INPUT to the check, so editing it must re-run the check. Otherwise
      # a removal can be blessed by updating the record of what exists, with nothing re-reading
      # reality.
      - 'scripts/lint/config-leaf-parity.json'
      - 'scripts/lint/lint-config-template-ssot.mjs'
      - '.github/workflows/config-template-ssot-lint.yml'
  push:
    branches: [dev]
    paths:
      - 'cloud/**/*.mjs'
      - 'daemons/**/*.mjs'
      - 'mcp/**/*.mjs'
      - 'scripts/**/*.mjs'
      - 'services/**/*.mjs'
      - 'shared/**/*.mjs'
      - 'config.template.mjs'
      - 'configBase.mjs'
      - 'ConfigProvider.mjs'
      - 'config.mjs'
      - 'test/**/*.mjs'
      - 'cloud/deploy/**'
      - 'learn/agentos/decisions/0019-aiconfig-reactive-provider-ssot.md'
      - 'scripts/lint/check-aiconfig-antipatterns.mjs'
      - 'scripts/lint/check-aiconfig-test-mutation.mjs'
      - 'scripts/lint/config-leaf-parity.json'
      - 'scripts/lint/lint-config-template-ssot.mjs'
      - '.github/workflows/config-template-ssot-lint.yml'

concurrency:
  group: config-template-ssot-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The lint boots the Tier-1 config, which evaluates through the published Engine, and parses
      # with acorn and js-yaml. Scripts are skipped because the postinstall materializes skills the
      # lint does not read, and a skills failure reporting itself as config drift would be exactly
      # the misattributed enforcement the path filters above exist to prevent.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint config template SSOT
        run: node scripts/lint/lint-config-template-ssot.mjs
