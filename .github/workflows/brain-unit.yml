name: Brain Unit

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]

permissions:
    contents: read

concurrency:
    group: brain-unit-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NEO_TEST_SKIP_CI: 'true'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install exact dependency graph without dependency lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Build the native SQLite binding
              run: npm rebuild better-sqlite3

            - name: Materialize Brain-owned install projections
              run: |
                  npm run postinstall
                  npm run prepare

            - name: Verify the received unit collection
              run: npm run test-unit -- --list

            - name: Run the move-first Brain smoke
              run: >-
                  npm run test-unit --
                  test/playwright/unit/ai/AgentOrchestrator.spec.mjs
                  test/playwright/unit/ai/Env.spec.mjs
                  test/playwright/unit/ai/scripts/setup/initServerConfigs.spec.mjs
                  test/playwright/unit/ai/buildScripts/util/check-aiconfig-antipatterns.spec.mjs
                  test/playwright/unit/ai/buildScripts/util/check-aiconfig-test-mutation.spec.mjs
                  test/playwright/unit/ai/buildScripts/util/check-atomic-write-shape.spec.mjs
                  test/playwright/unit/ai/scripts/lint/lintAdrSeamTable.spec.mjs
                  test/playwright/unit/ai/scripts/lint/checkFrontDoorFingerprint.spec.mjs
                  test/playwright/unit/ai/scripts/lint/lintTreeJson.spec.mjs
                  test/playwright/unit/ai/scripts/lint/lintGuardCiParity.spec.mjs
                  test/playwright/unit/ai/scripts/lint/lintWorkflowScanRootParity.spec.mjs
                  test/playwright/unit/harness/terminateDaemon.spec.mjs
                  test/playwright/unit/hooks
                  test/playwright/unit/test/ConfigTemplateResolver.spec.mjs
                  test/playwright/unit/test/assertSustainedHealth.spec.mjs
                  test/playwright/unit/test/chromaProcess.spec.mjs

            - name: Parse relocated non-default specs
              run: >-
                  node --check
                  test/playwright/e2e/benchmarks/HarnessEnduranceBenchmark.spec.mjs
                  &&
                  node --check
                  test/playwright/mcp/github-workflow/OpenapiIssues.spec.mjs
                  &&
                  node --check
                  test/playwright/update-chain/UpdateChainGoal.spec.mjs
