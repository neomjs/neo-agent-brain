name: Brain Unit

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]

permissions:
    contents: read

concurrency:
    group: brain-unit-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NEO_TEST_SKIP_CI: 'true'
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install exact dependency graph without dependency lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Build the native SQLite binding
              run: npm rebuild better-sqlite3

            # The seat-routing generator emits zsh, and its spec executes that output rather than a
            # JavaScript model of it. ubuntu-latest ships no zsh, so without this the shell arms can
            # only be skipped — which would leave the emitted `case` globs unverified everywhere
            # except a maintainer's Mac.
            - name: Install zsh, so the emitted shell is executed and not merely modelled
              run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

            - name: Materialize Brain-owned install projections
              run: |
                  npm run postinstall
                  npm run prepare

            - name: Verify the received unit collection
              run: npm run test-unit -- --list

            # `--list` above COLLECTS; only the specs named here execute. A cross-PR drift detector
            # is worthless outside this list, so it belongs in it.
            - name: Run the move-first Brain smoke
              run: >-
                  npm run test-unit --
                  test/playwright/unit/ai/AgentOrchestrator.spec.mjs
                  test/playwright/unit/ai/Env.spec.mjs
                  test/playwright/unit/harness/seatCredentialRouting.spec.mjs
                  test/playwright/unit/harness/terminateDaemon.spec.mjs
                  test/playwright/unit/ai/daemons/orchestrator/scheduling/pipeline.spec.mjs
                  test/playwright/unit/src/fleet/contract/fleetContract.spec.mjs
