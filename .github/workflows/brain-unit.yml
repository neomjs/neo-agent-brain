name: Brain Unit

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]

permissions:
    contents: read

concurrency:
    group: brain-unit-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NEO_TEST_SKIP_CI: 'true'
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install exact dependency graph without dependency lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Build the native SQLite binding
              run: npm rebuild better-sqlite3

            - name: Materialize Brain-owned install projections
              run: |
                  npm run postinstall
                  npm run prepare

            - name: Verify the received unit collection
              run: npm run test-unit -- --list

            # `--list` above COLLECTS; only the specs named here execute. A cross-PR drift detector
            # is worthless outside this list, so it belongs in it.
            - name: Run the move-first Brain smoke
              run: >-
                  npm run test-unit --
                  test/playwright/unit/ai/AgentOrchestrator.spec.mjs
                  test/playwright/unit/ai/Env.spec.mjs
                  test/playwright/unit/harness/terminateDaemon.spec.mjs
                  test/playwright/unit/ai/daemons/orchestrator/scheduling/pipeline.spec.mjs
                  test/playwright/unit/ai/daemons/orchestrator/scheduling/communityReconciliation.spec.mjs
                  test/playwright/unit/ai/daemons/orchestrator/services/CommunityReconciliationService.spec.mjs
                  test/playwright/unit/ai/scripts/maintenance/reconcileGithubCommunity.spec.mjs
                  test/playwright/unit/ai/services/memory-core/SourceRegistryService.spec.mjs
                  test/playwright/unit/src/fleet/contract/fleetContract.spec.mjs
                  test/playwright/unit/ai/services/neural-link/ConnectionService.spec.mjs
                  test/playwright/unit/ai/services/graph/SemanticGraphExtractor.spec.mjs
                  test/playwright/unit/ai/services/memory-core/MailboxService.spec.mjs
                  test/playwright/unit/ai/services/memory-core/helpers/defectObservationFold.spec.mjs
                  test/playwright/unit/ai/services/github-workflow/DiscussionReconciliationService.spec.mjs
                  test/playwright/unit/ai/services/github-workflow/community/githubDiscussionObservations.spec.mjs
                  test/playwright/unit/ai/services/github-workflow/community/githubDiscussionReconciliation.spec.mjs
                  test/playwright/unit/src/evolution/RemDigestion.spec.mjs
                  test/playwright/unit/ai/mcp/server/neural-link/Bridge.spec.mjs
                  test/playwright/unit/playwrightConfigUnit.spec.mjs
                  test/playwright/unit/chromaOwnership.spec.mjs

            - name: Verify community host authority boundary
              run: >-
                  npm run test-unit --
                  test/playwright/unit/ai/daemons/orchestrator/Orchestrator.spec.mjs
                  --grep 'community reconciliation is plane-owned'
