name: Brain Unit

on:
    pull_request:
        branches: [dev]
    push:
        branches: [dev]

permissions:
    contents: read

concurrency:
    group: brain-unit-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # The whole unit config runs twice, on the change and on its base, and `unit` compares the two
    # failure sets: it fails only on a test the change breaks. Neither run fails its own job — its
    # report is its output — so the base's known reds never reach the defect ledger's CI ingest, and
    # neither step is named like a green suite run the ingest would take as recovery evidence.
    suite:
        name: suite (${{ matrix.side }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                side: [head, base]
        env:
            NEO_TEST_SKIP_CI: 'true'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 2

            # A pull request's head is the merge commit GitHub tests, so its first parent is exactly
            # the base that merge was computed against. A push is measured against the tip it replaced.
            - name: Check out the base
              if: matrix.side == 'base'
              run: |
                  if [ "${{ github.event_name }}" = pull_request ]; then
                      git checkout --detach HEAD^1
                  else
                      git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
                      git checkout --detach FETCH_HEAD
                  fi

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install exact dependency graph without dependency lifecycle scripts
              run: npm ci --ignore-scripts --no-audit --no-fund

            - name: Build the native SQLite binding
              run: npm rebuild better-sqlite3

            - name: Materialize Brain-owned install projections
              # `prepare` runs the config bootstrap and then the skills materializer for this
              # checkout (INIT_CWD is the workspace). Never `postinstall`: npm runs a dependency's
              # postinstall inside every consumer's install.
              run: npm run prepare

            # The last test ends about 6.5 minutes in on this runner, but the run does not exit on
            # its own: its teardown never starts. The bound ends it with the report written and the
            # timeout recorded as a top-level error, which both sides share. A head run the bound
            # cuts short leaves tests unrun, and the comparison refuses those rather than trusting them.
            - name: Run the unit config
              continue-on-error: true
              run: npm run test-unit -- --global-timeout=600000

            - name: Keep the report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: unit-report-${{ matrix.side }}
                  path: test/playwright/test-results/unit/test-results.json
                  if-no-files-found: warn
                  retention-days: 7

    unit:
        needs: suite
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            # A side whose report is missing is refused by name in the next step.
            - name: Collect both reports
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: unit-report-*
                  path: reports

            - name: Compare the change's failures with its base's
              run: >-
                  node test/playwright/compareUnitFailures.mjs
                  --head reports/unit-report-head/test-results.json
                  --base reports/unit-report-base/test-results.json
