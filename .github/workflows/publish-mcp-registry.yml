name: Publish MCP Registry

# Publishes the Neural Link's `server.json` to the MCP Registry. The registry grants the
# `io.github.neomjs` namespace only to a credential that can read the organization role; GitHub
# Actions OIDC from this repository is that credential, with no secret to hold.
#
# Dispatch it from `dev` once the npm version `server.json` names is live: the registry validates the
# package against npm, so an earlier run fails. The other servers' manifests stay unpublished.

on:
  workflow_dispatch:

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: '1.8.4'
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish the Neural Link
        run: ./mcp-publisher publish ai/mcp/server/neural-link/server.json
