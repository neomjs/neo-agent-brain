name: Publish MCP Registry

# Publishes standalone MCP server manifests (`server.json`) to the MCP Registry. The registry
# grants the `io.github.neomjs` namespace only to a credential that can read the organization
# role; GitHub Actions OIDC from this repository is that credential, with no secret to hold.
#
# Dispatch it from `dev` once the npm version `server.json` names is live: the registry validates
# each package against npm, so an earlier run fails. Unpublished servers remain excluded.

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Standalone MCP server manifest to publish'
        required: true
        default: 'neural-link'
        type: choice
        options:
          - neural-link
          - memory-core
          - all

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: '1.8.4'
      MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry manifest(s)
        env:
          TARGET_SERVER: ${{ inputs.server || 'neural-link' }}
        run: |
          case "${TARGET_SERVER}" in
            neural-link)
              ./mcp-publisher publish ai/mcp/server/neural-link/server.json
              ;;
            memory-core)
              ./mcp-publisher publish ai/mcp/server/memory-core/server.json
              ;;
            all)
              ./mcp-publisher publish ai/mcp/server/neural-link/server.json
              ./mcp-publisher publish ai/mcp/server/memory-core/server.json
              ;;
            *)
              echo "Unsupported server selection: ${TARGET_SERVER}" >&2
              exit 1
              ;;
          esac
