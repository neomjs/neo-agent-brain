name: Discussion Lifecycle Audit

# Received from neomjs/neo under neomjs/neo#17783: every path this workflow invoked left the
# Engine with the Agent OS, so after the #17791 deletion it had no executable owner there.
# Run targets AND path filters are both translated through the receive manifests - a workflow
# that runs the right script while watching the old paths is the "guard present, correct, and
# never run" failure its own filters exist to prevent.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.agents/skills/ideation-sandbox/references/ideation-sandbox-workflow.md'
      - '.github/workflows/discussion-lifecycle-audit.yml'
      - 'scripts/diagnostics/audit-discussion-lifecycle.mjs'
      - 'package.json'
  push:
    branches: [dev]
    paths:
      - '.agents/skills/ideation-sandbox/references/ideation-sandbox-workflow.md'
      - '.github/workflows/discussion-lifecycle-audit.yml'
      - 'scripts/diagnostics/audit-discussion-lifecycle.mjs'
      - 'package.json'

concurrency:
  group: discussion-lifecycle-audit-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify discussion lifecycle audit script
        run: npm run ai:audit-discussion-lifecycle -- --self-test

      - name: Report discussion lifecycle candidates
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run ai:audit-discussion-lifecycle -- --report-only

      - name: Enforce graduated Discussion closure
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run ai:audit-discussion-lifecycle
