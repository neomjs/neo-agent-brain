name: Retired Primitives Check

# Received from neomjs/neo under neomjs/neo#17783: every path this workflow invoked left the
# Engine with the Agent OS, so after the #17791 deletion it had no executable owner there.
# Run targets AND path filters are both translated through the receive manifests - a workflow
# that runs the right script while watching the old paths is the "guard present, correct, and
# never run" failure its own filters exist to prevent.

on:
  pull_request:
    branches: [dev]
    paths:
      - 'cloud/**/*.mjs'
      - 'daemons/**/*.mjs'
      - 'mcp/**/*.mjs'
      - 'scripts/**/*.mjs'
      - 'services/**/*.mjs'
      - 'shared/**/*.mjs'
      - 'scripts/diagnostics/check-retired-primitives.mjs'
      - '.github/workflows/check-retired-primitives.yml'
  push:
    branches: [dev]
    paths:
      - 'cloud/**/*.mjs'
      - 'daemons/**/*.mjs'
      - 'mcp/**/*.mjs'
      - 'scripts/**/*.mjs'
      - 'services/**/*.mjs'
      - 'shared/**/*.mjs'
      - 'scripts/diagnostics/check-retired-primitives.mjs'
      - '.github/workflows/check-retired-primitives.yml'

concurrency:
  group: check-retired-primitives-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Retired Primitives
        run: npm run ai:check-retired-primitives
