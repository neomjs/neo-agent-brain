name: Brain Integration

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: brain-integration-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - integration-unified
          - integration-parity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json

      - name: Install exact dependency graph without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the independent Container-Cloud package
        working-directory: cloud
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pack the exact Brain checkout for current-head integration
        run: git archive --format=tar.gz --prefix=package/ --output=cloud/neo-agent-brain-head.tgz HEAD

      - name: Replace the pinned dependency with the exact checkout artifact
        working-directory: cloud
        run: npm install --ignore-scripts --no-save --package-lock=false ./neo-agent-brain-head.tgz

      - name: Build the native SQLite binding
        run: npm rebuild better-sqlite3

      - name: Materialize Brain-owned install projections
        # `prepare` runs the config bootstrap and then the skills materializer for this checkout
        # (INIT_CWD is the workspace). Never `postinstall`: npm runs a dependency's postinstall
        # inside every consumer's install.
        run: npm run prepare

      # Image construction has its own budget; Playwright's webServer timer measures readiness.
      - name: Build unified integration images
        if: matrix.suite == 'integration-unified'
        # Allow cold dependency downloads/native compilation half of the 30-minute job budget.
        timeout-minutes: 15
        run: docker compose -p neo-integration-test -f deploy/cloud/docker-compose.test.yml build

      - name: Run ${{ matrix.suite }}
        run: npm run test-${{ matrix.suite }}
        env:
          NEO_INTEGRATION_STACK_TIMEOUT_MS: '240000'
          NEO_INTEGRATION_PREBUILT: ${{ matrix.suite == 'integration-unified' && 'true' || 'false' }}

      - name: Upload test artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.suite }}-${{ github.run_id }}
          path: test/playwright/test-results/
          retention-days: 14
