name: Brain Integration

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: brain-integration-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - integration-unified
          - integration-parity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependency graph without dependency lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the native SQLite binding
        run: npm rebuild better-sqlite3

      - name: Materialize Brain-owned install projections
        run: |
          npm run postinstall
          npm run prepare

      - name: Run ${{ matrix.suite }}
        run: npm run test-${{ matrix.suite }}
        env:
          NEO_INTEGRATION_STACK_TIMEOUT_MS: '240000'

      - name: Upload test artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}-${{ github.run_id }}
          path: test/playwright/test-results/
          retention-days: 14
