name: MCP Test Location Lint

# Received from neomjs/neo under neomjs/neo#17783: every path this workflow invoked left the
# Engine with the Agent OS, so after the #17791 deletion it had no executable owner there.
# Run targets AND path filters are both translated through the receive manifests - a workflow
# that runs the right script while watching the old paths is the "guard present, correct, and
# never run" failure its own filters exist to prevent.

on:
  pull_request:
    branches: [dev]
    paths:
      - 'test/playwright/mcp/**'
      - 'test/playwright/unit/mcp/server/**'
      - 'scripts/lint/lint-mcp-test-locations.mjs'
      - 'test/unit/scripts/lint/lintMcpTestLocations.spec.mjs'
      - '.github/workflows/mcp-test-location-lint.yml'
      - 'package.json'
  push:
    branches: [dev]
    paths:
      - 'test/playwright/mcp/**'
      - 'test/playwright/unit/mcp/server/**'
      - 'scripts/lint/lint-mcp-test-locations.mjs'
      - 'test/unit/scripts/lint/lintMcpTestLocations.spec.mjs'
      - '.github/workflows/mcp-test-location-lint.yml'
      - 'package.json'

concurrency:
  group: mcp-test-location-lint-${{ github.run_attempt == '1' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Lint MCP test locations
        run: npm run ai:lint-mcp-test-locations
